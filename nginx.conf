server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip 压缩：JS/CSS/HTML 体积减 60-70%
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;

  # 带 hash 的静态资源：内容变文件名就变，可永久缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 入口 HTML：禁止缓存，保证发版后用户立即拿到新版
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA 路由回退：/listing/xxx 等前端路由刷新不 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
