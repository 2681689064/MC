<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>觅巢 - 天津租房聚合平台</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
    <style>
      /* 首屏品牌加载动画：JS 挂载 #root 前由 HTML 原生渲染，挂载后由 main.tsx 移除 */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #fdfcfa 0%, #f7f4ee 100%);
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-house {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(217, 119, 6, 0.28);
        animation: boot-bounce 1.4s ease-in-out infinite;
        object-fit: cover;
      }
      .boot-title {
        font-size: 20px;
        font-weight: 700;
        color: #292524;
        letter-spacing: 2px;
      }
      .boot-title span {
        color: #d97706;
      }
      .boot-sub {
        font-size: 13px;
        color: #a8a29e;
        letter-spacing: 4px;
      }
      .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 99px;
        background: #eee7db;
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #f59e0b, #d97706);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.04); }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader" aria-label="页面加载中">
      <!-- 觅巢 Logo：GitHub 云端仓库的 觅巢Logo.jpg（public/logo.jpg） -->
      <img class="boot-house" src="/logo.jpg" alt="觅巢" />
      <div class="boot-title">觅<span>巢</span></div>
      <div class="boot-sub">天津租房聚合平台</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
